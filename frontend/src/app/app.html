<!-- The toolbar belongs to the signed-in area, so it is hidden on the login screen rather than
     shown with a sign-out button that has nothing to sign out of. -->
@if (auth.isSignedIn()) {
  <mat-toolbar class="app-toolbar">
    <a class="app-title" routerLink="/">ProviderHub</a>

    <nav class="app-nav">
      <!-- routerLinkActive marks the current section, so the toolbar answers "where am I". -->
      <a
        matButton
        routerLink="/"
        routerLinkActive="app-nav--active"
        [routerLinkActiveOptions]="{ exact: true }"
        >Dashboard</a
      >
      <a matButton routerLink="/providers" routerLinkActive="app-nav--active">Providers</a>
      <a matButton routerLink="/services" routerLinkActive="app-nav--active">Services</a>
    </nav>

    <span class="app-spacer"></span>
    <span class="app-user">{{ auth.userName() }}</span>
    <button matIconButton type="button" aria-label="Sign out" (click)="auth.signOut()">
      <mat-icon>logout</mat-icon>
    </button>
  </mat-toolbar>
}

<main class="app-content" [class.app-content--framed]="auth.isSignedIn()">
  <router-outlet />
</main>
