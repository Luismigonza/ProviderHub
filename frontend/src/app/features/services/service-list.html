<header class="list-header">
  <h1 class="list-title">Service catalogue</h1>
  <span class="list-spacer"></span>

  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="list-search">
    <mat-label>Search</mat-label>
    <mat-icon matPrefix>search</mat-icon>
    <!-- The debounce lives in the list, not here: one round trip per pause, not per keystroke. -->
    <input matInput type="search" (input)="onSearch($any($event.target).value)" />
  </mat-form-field>

  <button matButton="filled" type="button" (click)="create()">
    <mat-icon>add</mat-icon>
    New service
  </button>
</header>

<mat-card appearance="outlined" class="list-card">
  @if (list.loading()) {
    <mat-progress-bar mode="indeterminate" />
  }

  @if (list.error(); as message) {
    <p class="list-error" role="alert">{{ message }}</p>
  } @else {
    <table mat-table [dataSource]="list.rows()" matSort (matSortChange)="onSort($event)" class="list-table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
        <td mat-cell *matCellDef="let service">{{ service.name }}</td>
      </ng-container>

      <ng-container matColumnDef="hourlyRate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="numeric">Hourly rate</th>
        <td mat-cell *matCellDef="let service" class="numeric">
          {{ service.hourlyRate | currency: service.currency }}
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef aria-label="Actions"></th>
        <td mat-cell *matCellDef="let service">
          <button
            matIconButton
            type="button"
            [attr.aria-label]="'Edit ' + service.name"
            (click)="edit(service)"
          >
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>

    @if (list.rows().length === 0 && !list.loading()) {
      <p class="list-empty">No services match that search.</p>
    }
  }

  <!-- Server-side paging: the paginator reports the total the API sent, not the rows on screen. -->
  <mat-paginator
    [length]="list.total()"
    [pageIndex]="list.pageIndex()"
    [pageSize]="list.pageSize()"
    [pageSizeOptions]="[5, 10, 25, 50]"
    (page)="onPage($event)"
  />
</mat-card>
